name: paatufy
description: "Open Music Streaming & Personal Music Management Application"
publish_to: "none"
version: 1.1.7+18

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.8.1

  # Audio & Background Playback
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Networking & Serialization
  dio: ^5.4.1
  json_annotation: ^4.8.1

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Storage & Data Management
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.1

  # UI Components & Utilities
  cached_network_image: ^3.3.1
  lucide_icons_flutter: ^3.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # Security & Authentication
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  uuid: ^4.3.3

  # In-App Update Packages
  package_info_plus: ^8.3.1
  path_provider: ^2.1.3
  android_intent_plus: ^5.1.3
  permission_handler: ^11.3.1

  # Network Connectivity & Monitoring
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  http: ^1.2.0
  googleapis_auth: ^1.6.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/paatufy_lancher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/paatufy_lancher_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/paatufy-purple.png
